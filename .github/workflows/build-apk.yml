name: 建置 APK

on:
  workflow_dispatch:
  push:
    branches: [main, android-apk]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 準備簽名金鑰
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # 有設定 secrets：使用固定的正式金鑰（升級免重裝）
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "store_pw=$KEYSTORE_PASSWORD"
              echo "key_alias=$KEY_ALIAS"
              echo "key_pw=$KEY_PASSWORD"
            } >> "$GITHUB_OUTPUT"
          else
            # 未設定 secrets：產生本次建置專用的臨時金鑰（更新 APK 時需先解除安裝舊版）
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" \
              -alias pttv -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass pttv-temp-key -keypass pttv-temp-key \
              -dname "CN=PTtv Board, O=PTtv, C=TW"
            {
              echo "store_pw=pttv-temp-key"
              echo "key_alias=pttv"
              echo "key_pw=pttv-temp-key"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: 編譯 Release APK
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.store_pw }}
          KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_pw }}
        run: gradle assembleRelease

      - name: 重新命名 APK
        run: cp android-app/app/build/outputs/apk/release/app-release.apk PTtv.apk

      - name: 上傳為建置產物
        uses: actions/upload-artifact@v4
        with:
          name: PTtv-apk
          path: PTtv.apk

      - name: 發佈到 Release（apk-latest）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create apk-latest --repo "$GITHUB_REPOSITORY" \
              --title "PTtv 看板 APK" \
              --notes "最新版看板 APK，由 GitHub Actions 自動建置。下載 PTtv.apk 安裝到 Android 裝置即可。"
          gh release upload apk-latest PTtv.apk --repo "$GITHUB_REPOSITORY" --clobber
